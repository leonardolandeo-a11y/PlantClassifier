services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plantclassifier}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - plantclassifier_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-plantclassifier}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CONTROL_USERNAME: ${CONTROL_USERNAME:?Set CONTROL_USERNAME}
      CONTROL_PASSWORD: ${CONTROL_PASSWORD:?Set CONTROL_PASSWORD}
      DEVICE_TOKEN: ${DEVICE_TOKEN:?Set DEVICE_TOKEN}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ML_PYTHON_PATH: /opt/venv/bin/python3
      ML_SCRIPT_PATH: predict.py
      ML_WORKING_DIRECTORY: /app/MLClassification
      ML_TIMEOUT: ${ML_TIMEOUT:-30s}
      ESP32_URL: ${ESP32_URL:?Set the sensor ESP32 address}
      MOVEMENT_ESP32_URL: ${MOVEMENT_ESP32_URL:?Set the movement ESP32 address}
      ESP32_CONNECT_TIMEOUT: ${ESP32_CONNECT_TIMEOUT:-2s}
      ESP32_READ_TIMEOUT: ${ESP32_READ_TIMEOUT:-5s}
      MOVEMENT_CONNECT_TIMEOUT: ${MOVEMENT_CONNECT_TIMEOUT:-300ms}
      MOVEMENT_READ_TIMEOUT: ${MOVEMENT_READ_TIMEOUT:-500ms}
      SENSOR_TEMPERATURE_MIN: ${SENSOR_TEMPERATURE_MIN:--40}
      SENSOR_TEMPERATURE_MAX: ${SENSOR_TEMPERATURE_MAX:-85}
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  plantclassifier_postgres_data:
