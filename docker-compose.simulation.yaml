# Two software devices; use with docker-compose.yaml and the same project/environment.
services:
  simulator:
    image: plantclassifier-simulator
    build: .
    entrypoint: ["python", "/simulator/esp32-simulator.py", "--host", "0.0.0.0", "--port", "8081", "--role", "movement"]
    environment:
      DEVICE_TOKEN: ${DEVICE_TOKEN:?Set DEVICE_TOKEN}
    volumes:
      - ./scripts/esp32-simulator.py:/simulator/esp32-simulator.py:ro
    ports:
      - "127.0.0.1:18081:8081"
    restart: unless-stopped
  sensor-simulator:
    image: plantclassifier-simulator
    build: .
    entrypoint: ["python", "/simulator/esp32-simulator.py", "--host", "0.0.0.0", "--port", "8081", "--role", "sensor"]
    environment:
      DEVICE_TOKEN: ${DEVICE_TOKEN:?Set DEVICE_TOKEN}
    volumes:
      - ./scripts/esp32-simulator.py:/simulator/esp32-simulator.py:ro
    ports:
      - "127.0.0.1:18082:8081"
    restart: unless-stopped
  app:
    environment:
      ESP32_URL: http://sensor-simulator:8081
      MOVEMENT_ESP32_URL: http://simulator:8081
    depends_on:
      sensor-simulator:
        condition: service_started
      simulator:
        condition: service_started
