<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · PlantClassifier</title><link rel="stylesheet" href="/css/output.css"></head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<header class="app-header"><div class="page-container header-content"><a class="app-title" href="/">PlantClassifier</a></div></header>
<main class="login-panel"><h1 class="section-title">Operator sign in</h1>
<p>Sign in to capture sensor data and control your ESP32.</p>
<p role="alert" class="login-error">{{error}}</p>
<form action="/login" method="post" class="login-form">
<input type="hidden" name="{{csrfName}}" value="{{csrfToken}}">
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button class="capture-button" type="submit">Sign in</button>
</form><a href="/">Return to dashboard</a></main></body></html>
