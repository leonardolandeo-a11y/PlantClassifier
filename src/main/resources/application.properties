spring.application.name=PlantClassifier
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/plantclassifier}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

device.token=${DEVICE_TOKEN}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=8KB

ml.python.path=${ML_PYTHON_PATH:python3}
ml.script.path=${ML_SCRIPT_PATH:predict.py}
ml.working-directory=${ML_WORKING_DIRECTORY:MLClassification}
ml.timeout=${ML_TIMEOUT:30s}
esp32.url=${ESP32_URL}
movement.esp32.url=${MOVEMENT_ESP32_URL}
esp32.connect-timeout=${ESP32_CONNECT_TIMEOUT:2s}
esp32.read-timeout=${ESP32_READ_TIMEOUT:5s}
movement.connect-timeout=${MOVEMENT_CONNECT_TIMEOUT:300ms}
movement.read-timeout=${MOVEMENT_READ_TIMEOUT:500ms}
sensor.temperature-min=${SENSOR_TEMPERATURE_MIN:-40}
sensor.temperature-max=${SENSOR_TEMPERATURE_MAX:85}
