spring.application.name=PlantClassifier

# =========================
# DATABASE CONFIGURATION
# =========================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/plantclassifier}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Landeo01_@}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# MACHINE LEARNING
# =========================

ml.python.path=${ML_PYTHON_PATH:python3}
ml.script.path=${ML_SCRIPT_PATH:predict.py}
ml.working-directory=${ML_WORKING_DIRECTORY:MLClassification}

# =========================
# ESP32 CONFIGURATION
# =========================

# ESP32 - Sensors
esp32.url=${ESP32_URL:http://192.168.100.66}

# ESP32 - Robot Movement
movement.esp32.url=${MOVEMENT_ESP32_URL:http://10.164.29.196}

# =========================
# SERVER CONFIGURATION
# =========================

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}