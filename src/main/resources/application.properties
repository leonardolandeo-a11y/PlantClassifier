spring.application.name=PlantClassifier

# =========================
# DATABASE CONFIGURATION
# =========================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/plantclassifier}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# =========================
# MACHINE LEARNING
# =========================

ml.python.path=${ML_PYTHON_PATH:python3}
ml.script.path=${ML_SCRIPT_PATH:predict.py}
ml.working-directory=${ML_WORKING_DIRECTORY:MLClassification}

# =========================
# ESP32 CONFIGURATION
# =========================

# ESP32 - Sensors
esp32.url=${ESP32_URL:http://127.0.0.1}

# ESP32 - Robot Movement
movement.esp32.url=${MOVEMENT_ESP32_URL:http://127.0.0.1}
esp32.connect-timeout=${ESP32_CONNECT_TIMEOUT:2s}
esp32.read-timeout=${ESP32_READ_TIMEOUT:5s}
ml.timeout=${ML_TIMEOUT:30s}

# =========================
# SERVER CONFIGURATION
# =========================

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
