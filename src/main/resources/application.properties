spring.application.name=PlantClassifier

# =========================
# DATABASE CONFIGURATION
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/plantclassifier}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# MACHINE LEARNING
# =========================
ml.python.path=${ML_PYTHON_PATH:python3}
ml.script.path=${ML_SCRIPT_PATH:predict.py}
ml.working-directory=${ML_WORKING_DIRECTORY:MLClassification}

# =========================
# ESP32 CONFIGURATION
# =========================
esp32.url=${ESP32_URL:http://192.168.100.66}
movement.esp32.url=${MOVEMENT_ESP32_URL:http://192.168.100.67}

# =========================
# SERVER CONFIGURATION
# =========================
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}