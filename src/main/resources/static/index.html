
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Monitor</title>
    <link rel="stylesheet" href="./css/output.css">
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">

    <!-- HEADER -->
    <header class="app-header">
        <div class="page-container header-content">
            <div>
                <h1 class="app-title">
                    🌱 Plant Monitor
                </h1>

            </div>
        </div>
    </header>

    <!-- DASHBOARD -->
    <main class="page-container dashboard-main">

        <!-- ENVIRONMENTAL SENSORS -->
        <section aria-labelledby="sensor-heading">

            <h2 id="sensor-heading" class="section-title">
                Environmental Sensors
            </h2>



            <div class="sensor-grid">

                <!-- pH -->
                <article class="sensor-card">
                    <div class="sensor-card-header">
                        <h3 class="sensor-label">
                            pH Level
                        </h3>
                        <span class="sensor-icon" aria-hidden="true">
                            🧪
                        </span>
                    </div>

                    <p class="sensor-reading">
                        <span id="ph">--</span>
                        <span class="sensor-unit">pH</span>
                    </p>
                </article>

                <!-- Temperature -->
                <article class="sensor-card">
                    <div class="sensor-card-header">
                        <h3 class="sensor-label">
                            Temperature
                        </h3>
                        <span class="sensor-icon" aria-hidden="true">
                            🌡️
                        </span>
                    </div>

                    <p class="sensor-reading">
                        <span id="temperature">--</span>
                        <span class="sensor-unit">°C</span>
                    </p>
                </article>

                <!-- Humidity -->
                <article class="sensor-card">
                    <div class="sensor-card-header">
                        <h3 class="sensor-label">
                            Humidity
                        </h3>
                        <span class="sensor-icon" aria-hidden="true">
                            💧
                        </span>
                    </div>

                    <p class="sensor-reading">
                        <span id="humidity">--</span>
                        <span class="sensor-unit">%</span>
                    </p>
                </article>

            </div>
        </section>

        <!-- PLANT RECOMMENDATION -->
        <section class="mt-8" aria-labelledby="prediction-heading">

            <article class="prediction-panel">

                <div class="prediction-content">

                    <div class="prediction-icon" aria-hidden="true">
                        🌿
                    </div>

                    <div>
                        <p class="prediction-label">
                            PLANT RECOMMENDATION
                        </p>

                        <h2 id="prediction-heading"
                            class="prediction-heading">
                            Find the right plant
                        </h2>
                    </div>

                </div>

                <div class="prediction-result">

                    <p class="prediction-result-label">
                        Recommended Plant
                    </p>

                    <p id="prediction"
                       class="prediction-value"
                       aria-live="polite">
                        --
                    </p>

                </div>

            </article>
        </section>

        <!-- SENSOR CONTROL -->
        <section class="control-panel"
                 aria-labelledby="control-heading">

            <div>
                <h2 id="control-heading" class="control-title">
                    Sensor Control
                </h2>

                <p class="control-description">
                    Capture the latest environmental readings
                    directly from your sensors.
                </p>
            </div>

            <button
                id="CaptureData"
                type="button"
                class="capture-button">

                <span id="buttonText">
                    Capture Data
                </span>

            </button>

        </section>

    </main>

    <script type="module" src="./js/scripts.js"></script>

</body>
</html>
