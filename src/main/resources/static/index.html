<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Monitor</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="dashboard">

    <header class="topbar">
        <div class="header-left">
            <h1>🌱 Plant Monitor</h1>
        </div>


    </header>

    <main>

        <section class="sensor-grid">

            <div class="sensor-card ph-card">
                <div class="sensor-icon">🧪</div>
                <div class="sensor-info">
                    <h2>pH Level</h2>
                    <p class="sensor-value"><span id="ph">--</span></p>
                    <span class="sensor-unit">pH</span>
                </div>
            </div>

            <div class="sensor-card temperature-card">
                <div class="sensor-icon">🌡️</div>
                <div class="sensor-info">
                    <h2>Temperature</h2>
                    <p class="sensor-value"><span id="temperature">--</span></p>
                    <span class="sensor-unit">°C</span>
                </div>
            </div>

            <div class="sensor-card humidity-card">
                <div class="sensor-icon">💧</div>
                <div class="sensor-info">
                    <h2>Humidity</h2>
                    <p class="sensor-value"><span id="humidity">--</span></p>
                    <span class="sensor-unit">%</span>
                </div>
            </div>

            <div class="sensor-card plant-card large-card">
                <div class="sensor-icon big-icon">🌿</div>
                <div class="sensor-info">
                    <div class="plant-header">
                        <h2>Recommended Plant</h2>
                    </div>

                    <p class="sensor-value prediction-value">
                        <span id="prediction">--</span>
                    </p>


                </div>
            </div>

        </section>

        <section class="control-panel">
            <h2>Sensor Control</h2>


            <button id="CaptureData">
                <span id="buttonText">Capture Data</span>
            </button>
        </section>

    </main>


</div>

<script src="/js/script.js"></script>
</body>
</html>
